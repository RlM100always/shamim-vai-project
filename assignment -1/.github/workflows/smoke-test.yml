name: Python smoke tests
on:
  push:
    paths:
      - 'assignment -1/src/**'
      - 'assignment -1/tests/**'
      - 'assignment -1/requirements.txt'
  pull_request:
    paths:
      - 'assignment -1/src/**'
      - 'assignment -1/tests/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy scikit-learn pandas matplotlib torch pytest
      - run: cd 'assignment -1' && pytest -q
