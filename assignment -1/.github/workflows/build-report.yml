name: Build LaTeX report
on:
  push:
    paths:
      - 'assignment -1/report/**'
      - '.github/workflows/build-report.yml'
  workflow_dispatch:
jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Compile report
        working-directory: assignment -1/report
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: applied-ai-assignment-1-report
          path: assignment -1/report/main.pdf
