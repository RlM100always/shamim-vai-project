name: Run Assignment 1 project and build report

on:
  push:
    paths:
      - 'assignment -1/src/**'
      - 'assignment -1/scripts/**'
      - 'assignment -1/notebooks/**'
      - 'assignment -1/report/**'
      - 'assignment -1/requirements.txt'
      - '.github/workflows/assignment1-full-run.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-project:
    if: ${{ !contains(github.event.head_commit.message, '[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'assignment -1/requirements.txt'

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra texlive-extra-utils

      - name: Install CPU dependencies
        working-directory: assignment -1
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt

      - name: Download official dataset
        working-directory: assignment -1
        run: python scripts/download_dataset.py

      - name: Execute notebook and train all models
        working-directory: assignment -1
        run: |
          jupyter nbconvert --execute --to notebook --inplace notebooks/assignment_1_sentiment_analysis.ipynb --ExecutePreprocessor.timeout=3600

      - name: Generate word count and compile report
        working-directory: assignment -1
        run: |
          python scripts/build_report.py
          cd report
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Commit executed notebook, results and PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "assignment -1/notebooks/assignment_1_sentiment_analysis.ipynb"
          git add -f "assignment -1/results"
          git add -f "assignment -1/report/generated_dataset.tex" "assignment -1/report/generated_results.tex" "assignment -1/report/generated_discussion.tex" "assignment -1/report/generated_wordcount.tex" "assignment -1/report/main.pdf"
          git commit -m "[bot] add executed notebook, measured results and report" || echo "No generated changes to commit"
          git push

      - name: Upload complete coursework outputs
        uses: actions/upload-artifact@v4
        with:
          name: assignment-1-executed-output
          path: |
            assignment -1/notebooks/assignment_1_sentiment_analysis.ipynb
            assignment -1/results/
            assignment -1/report/main.pdf
            assignment -1/report/main.tex
            assignment -1/report/generated_*.tex
